worker_processes 1;
daemon off;
error_log /home/koyon/42-cursus/webserv_shadow/tests/logs/nginx_error.log warn;
pid /home/koyon/42-cursus/webserv_shadow/tests/logs/nginx.pid;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /home/koyon/42-cursus/webserv_shadow/tests/logs/nginx_access.log;
    client_body_temp_path /home/koyon/42-cursus/webserv_shadow/tests/logs/nginx_body_tmp;
    proxy_temp_path /home/koyon/42-cursus/webserv_shadow/tests/logs/nginx_proxy_tmp;
    fastcgi_temp_path /home/koyon/42-cursus/webserv_shadow/tests/logs/nginx_fastcgi_tmp;
    uwsgi_temp_path /home/koyon/42-cursus/webserv_shadow/tests/logs/nginx_uwsgi_tmp;
    scgi_temp_path /home/koyon/42-cursus/webserv_shadow/tests/logs/nginx_scgi_tmp;

    server {
        listen 127.0.0.1:18200;
        server_name localhost;

        root /home/koyon/42-cursus/webserv_shadow/examples/www;
        index index.html;

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        client_max_body_size 5m;

        location / {
        }

        location /listing/ {
            autoindex on;
        }

        location /files/ {
            autoindex on;
            limit_except GET DELETE { deny all; }
            dav_methods DELETE;
        }

        location /upload/ {
            client_max_body_size 5m;
            client_body_temp_path /home/koyon/42-cursus/webserv_shadow/tests/logs/nginx_upload_tmp;
            limit_except POST { deny all; }
            return 501 "upload only for parity";  # nginx cannot POST-to-disk natively
        }

        location = /echo {
            limit_except POST { deny all; }
            return 501 "echo only for parity";
        }

        location /redirect {
            return 302 /about.html;
        }
    }
}
