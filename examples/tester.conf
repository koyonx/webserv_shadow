# examples/tester.conf
# Config tailored to ./testers/tester expectations:
#   - /               GET only, index index.html
#   - /*.bla anywhere routed via ./testers/cgi_tester
#   - /post_body      POST, client_max_body_size 100
#   - /directory/     GET, serves YoupiBanane, index youpi.bad_extension
#
# Uses subject-correct root semantics (alias-style prefix stripping).

http {
    # The 42 tester sends 100_000_000-byte POST bodies to /directory/*.bla;
    # cap the http-level ceiling well above that. /post_body keeps its
    # own strict 100-byte cap via location override.
    client_max_body_size 200m;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        root .;

        location / {
            allowed_methods GET;
            index index.html;
            cgi_pass .bla ./testers/cgi_tester;
        }

        location /directory/ {
            # GET for static files, POST for .bla CGI (subject spec:
            # ".bla must answer to POST"). The Connection layer refuses
            # to run cgi_tester on non-POST so GET on .bla still 405s.
            allowed_methods GET POST;
            root YoupiBanane;
            index youpi.bad_extension;
            autoindex off;
            cgi_pass .bla ./testers/cgi_tester;
        }

        location /post_body {
            allowed_methods POST;
            client_max_body_size 100;
            upload_store post_body_uploads;
        }
    }
}
