# examples/tester.conf
# Config tailored to ./testers/tester expectations:
#   - /               GET only  (index.html)
#   - /*.bla anywhere routed via cgi_tester
#   - /post_body      POST, client_max_body_size 100
#   - /directory/     GET, root YoupiBanane, index youpi.bad_extension

http {
    client_max_body_size 100000;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        root .;

        location / {
            allowed_methods GET;
            index index.html;
            cgi_pass .bla ./testers/cgi_tester;
        }

        location /directory/ {
            allowed_methods GET;
            root YoupiBanane;
            index youpi.bad_extension;
            autoindex off;
            cgi_pass .bla ./testers/cgi_tester;
        }

        location /post_body {
            allowed_methods POST;
            client_max_body_size 100;
            upload_store post_body_uploads;
        }
    }
}
