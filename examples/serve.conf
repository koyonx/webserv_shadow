# examples/serve.conf
# End-to-end static serving smoke config used by --serve smoke tests.
#
# `root` follows the subject's alias-style semantics: the location's
# URL prefix is stripped from the request before joining with `root`.
# Example from the subject:
#     URL /kapouet rooted at /tmp/www
#     -> /kapouet/pouic/toto/pouet serves /tmp/www/pouic/toto/pouet

http {
    server {
        listen 127.0.0.1:18100;
        server_name localhost;

        root examples/www;
        index index.html;

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location / {
            allowed_methods GET;
        }

        location /listing/ {
            allowed_methods GET;
            root examples/www/listing;
            autoindex on;
        }

        location /files/ {
            allowed_methods GET DELETE;
            root examples/www/files;
            autoindex on;
        }

        location /upload/ {
            allowed_methods POST;
            upload_store examples/uploads;
            client_max_body_size 5m;
        }

        location /echo {
            allowed_methods POST;
        }

        location /cgi-bin/ {
            allowed_methods GET POST;
            root examples/cgi-bin;
            cgi_pass .py /usr/bin/python3;
            cgi_pass .sh /bin/bash;
        }

        location /redirect {
            return 302 /about.html;
        }
    }
}
