# examples/serve.conf
# End-to-end static serving smoke config used by --serve smoke tests.

http {
    server {
        listen 127.0.0.1:18100;
        server_name localhost;

        root examples/www;
        index index.html;

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location / {
            allowed_methods GET;
        }

        location /listing/ {
            allowed_methods GET;
            root examples/www;
            autoindex on;
        }

        location /files/ {
            allowed_methods GET DELETE;
            root examples/www;
            autoindex on;
        }

        location /redirect {
            return 302 /about.html;
        }
    }
}
