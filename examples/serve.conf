# examples/serve.conf
# End-to-end static serving smoke config used by --serve smoke tests.

http {
    server {
        listen 127.0.0.1:18100;
        server_name localhost;

        root examples/www;
        index index.html;

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location / {
            allowed_methods GET;
        }

        location /listing/ {
            allowed_methods GET;
            root examples/www;
            autoindex on;
        }

        location /files/ {
            allowed_methods GET DELETE;
            root examples/www;
            autoindex on;
        }

        location /upload/ {
            allowed_methods POST;
            upload_store examples/uploads;
            client_max_body_size 5m;
        }

        location /echo {
            allowed_methods POST;
        }

        location /cgi-bin/ {
            allowed_methods GET POST;
            root examples;
            cgi_pass .py /usr/bin/python3;
        }

        location /redirect {
            return 302 /about.html;
        }
    }
}
