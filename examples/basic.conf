# examples/basic.conf
# Minimal sample config exercising the parser.

http {
    client_max_body_size 10m;
    keepalive_timeout 65;

    server {
        listen 0.0.0.0:8080;
        server_name example.com www.example.com;

        root /var/www/html;
        index index.html;

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location / {
            allowed_methods GET POST;
            autoindex off;
        }

        location /upload/ {
            allowed_methods POST;
            upload_store /var/uploads;
            client_max_body_size 100m;
        }

        location /cgi-bin/ {
            root /var/www/cgi-bin;
            cgi_pass .php /usr/bin/php-cgi;
            cgi_pass .py  /usr/bin/python3;
        }

        location /old {
            return 301 /new;
        }
    }
}

# A directly-declared server block is also supported (http { } wrap optional).
server {
    listen 9000;
    server_name direct.local;
    root /var/www/direct;

    location / {
        allowed_methods GET;
    }
}
